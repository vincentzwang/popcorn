services:
  - type: web
    name: popcorn
    env: node
    plan: starter
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "postgresql://postgres:[YOUR-PASSWORD]@db.yrgfuxwazbxeaytypxie.supabase.co:5432/postgres"
